<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Restaurant Owner Dashboard — VoiceDesk</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf8f4;--s1:#ffffff;--s2:#f4f1eb;--s3:#ede9e0;
  --b1:#e8e2d6;--b2:#d4cdc0;
  --gold:#a07830;--gold2:#c49a48;--goldb:#fdf6e8;
  --text:#1a1610;--textm:#7a7060;--texts:#b0a898;
  --red:#c04838;--green:#3a8a40;--greenb:#edf7ee;
}
html,body{height:100%;width:100%;}
body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg, #f5f3ed 0%, #e8e2d6 100%);color:var(--text);display:flex;}

.dash-container{width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg);}

.dash-header{background:var(--s1);border-bottom:1px solid var(--b1);padding:1.5rem 2rem;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.dash-header-left{display:flex;align-items:center;gap:1.5rem;}
.dash-title{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--text);}
.dash-subtitle{font-size:12px;color:var(--texts);margin-top:0.25rem;}
.dash-status{display:flex;align-items:center;gap:6px;padding:0.5rem 1rem;background:var(--greenb);border:1px solid #b8debb;border-radius:20px;font-size:12px;color:var(--green);}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.back-nav{margin-left:auto;display:flex;gap:0.75rem;}
.nav-btn{padding:0.65rem 1.2rem;border-radius:10px;background:var(--bg);border:1px solid var(--b1);color:var(--textm);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all 0.2s;}
.nav-btn:hover{border-color:var(--b2);color:var(--text);}

.dash-content{flex:1;overflow-y:auto;padding:2rem;max-width:1400px;margin:0 auto;width:100%;}

.section{margin-bottom:2.5rem;}
.sec-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--text);margin-bottom:1rem;display:flex;align-items:center;gap:8px;}
.sec-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem;}
.stat-card{background:var(--s1);border:1px solid var(--b1);border-radius:12px;padding:1.25rem;text-align:center;transition:all 0.2s;}
.stat-card:hover{border-color:var(--gold);box-shadow:0 4px 16px rgba(160,120,48,0.08);}
.stat-value{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:600;color:var(--gold);margin-bottom:0.5rem;}
.stat-label{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--texts);}

.bookings-section{background:var(--s1);border:1px solid var(--b1);border-radius:12px;overflow:hidden;}
.bk-header{padding:1rem 1.5rem;border-bottom:1px solid var(--b1);background:var(--s2);}
.bk-label{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--texts);margin-bottom:0.5rem;}
.bk-list{display:flex;flex-direction:column;}
.bk-item{padding:1rem 1.5rem;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:1rem;transition:all 0.2s;}
.bk-item:hover{background:var(--s2);}
.bk-item:last-child{border:none;}
.bk-avatar{width:44px;height:44px;border-radius:50%;background:var(--goldb);border:1.5px solid #e8d4a0;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--gold);flex-shrink:0;}
.bk-info{flex:1;}
.bk-name{font-weight:500;color:var(--text);margin-bottom:0.25rem;}
.bk-meta{font-size:12px;color:var(--textm);display:flex;gap:1rem;flex-wrap:wrap;}
.bk-meta-item{display:flex;align-items:center;gap:4px;}
.bk-actions{display:flex;gap:0.5rem;}
.action-btn{padding:0.5rem 0.9rem;border-radius:8px;background:var(--bg);border:1px solid var(--b1);color:var(--textm);font-size:12px;cursor:pointer;transition:all 0.2s;}
.action-btn:hover{border-color:var(--gold2);color:var(--gold);}
.bk-badge{display:inline-block;padding:0.35rem 0.75rem;background:var(--greenb);border:1px solid #b8debb;border-radius:20px;font-size:10px;color:var(--green);font-weight:500;}

.calls-section{background:var(--s1);border:1px solid var(--b1);border-radius:12px;overflow:hidden;}
.call-item{padding:1rem 1.5rem;border-bottom:1px solid var(--b1);transition:all 0.2s;}
.call-item:hover{background:var(--s2);}
.call-item:last-child{border:none;}
.call-top{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.5rem;}
.call-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;}
.call-icon.ok{background:var(--greenb);border:1px solid #b8debb;}
.call-icon.mod{background:#eef4fe;border:1px solid #b8d0f8;}
.call-icon.faq{background:var(--goldb);border:1px solid #e8d4a0;}
.call-icon.escalated{background:#fff8ed;border:1px solid #f0d890;}
.call-who{font-weight:500;color:var(--text);flex:1;}
.call-tag{display:inline-block;padding:0.2rem 0.7rem;border-radius:12px;font-size:10px;text-transform:uppercase;letter-spacing:0.04em;}
.call-tag.ok{background:var(--greenb);color:var(--green);border:1px solid #b8debb;}
.call-tag.mod{background:#eef4fe;color:#2a5ab8;border:1px solid #b8d0f8;}
.call-tag.faq{background:var(--goldb);color:var(--gold);border:1px solid #e8d4a0;}
.call-tag.escalated{background:#fff8ed;color:#7a5a10;border:1px solid #f0d890;}
.call-text{font-size:12.5px;color:var(--textm);line-height:1.6;margin-bottom:0.5rem;}
.call-meta{font-size:11px;color:var(--texts);display:flex;gap:1rem;}

.empty-state{text-align:center;padding:3rem 2rem;color:var(--texts);}
.empty-icon{font-size:2.5rem;margin-bottom:1rem;opacity:0.3;}
.empty-text{font-size:13px;}

.loading{text-align:center;padding:2rem;color:var(--textm);}
.spinner{display:inline-block;width:24px;height:24px;border:2px solid var(--b1);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:768px){
  .dash-header{flex-direction:column;align-items:flex-start;gap:1rem;}
  .dash-header-left{flex-direction:column;gap:0.5rem;}
  .back-nav{margin-left:0;width:100%;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .dash-content{padding:1rem;}
}
</style>
</head>
<body>
<div class="dash-container">

  <div class="dash-header">
    <div class="dash-header-left">
      <div>
        <div class="dash-title">La <em style="font-style:italic;color:var(--gold)">Bella</em> — Owner Dashboard</div>
        <div class="dash-subtitle">Sofia · AI Host · Real-time analytics & reservations</div>
      </div>
      <div class="dash-status">
        <div class="status-dot"></div>
        <span>Sofia online</span>
      </div>
    </div>
    <div class="back-nav">
      <button class="nav-btn" onclick="window.location.href='/'">← Back to homepage</button>
    </div>
  </div>

  <div class="dash-content">

    <!-- STATISTICS SECTION -->
    <div class="section">
      <div class="sec-title">
        <div class="sec-icon">📊</div>
        Today's Statistics
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="stat-calls">0</div>
          <div class="stat-label">Total Calls</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-bookings">0</div>
          <div class="stat-label">New Bookings</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-mods">0</div>
          <div class="stat-label">Modifications</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-resolved">0%</div>
          <div class="stat-label">Resolution Rate</div>
        </div>
      </div>
    </div>

    <!-- TODAY'S RESERVATIONS -->
    <div class="section">
      <div class="sec-title">
        <div class="sec-icon">📅</div>
        Today's Reservations
      </div>
      <div class="bookings-section">
        <div class="bk-header">
          <div class="bk-label">4 reservations confirmed</div>
        </div>
        <div class="bk-list" id="bookings-list">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>
    </div>

    <!-- RECENT CALLS -->
    <div class="section">
      <div class="sec-title">
        <div class="sec-icon">📞</div>
        Recent Calls
      </div>
      <div class="calls-section">
        <div id="calls-list">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>
    </div>

  </div>

</div>

<script>
const $=id=>document.getElementById(id);

// Load data from API
async function loadData(){
  try{
    const [bookingsRes,callsRes]=await Promise.all([
      fetch('/api/bookings'),
      fetch('/api/call-logs')
    ]);
    
    const bookings=await bookingsRes.json();
    const calls=await callsRes.json();
    
    renderBookings(bookings);
    renderCalls(calls);
    updateStats(bookings,calls);
  }catch(e){
    console.error('Failed to load data:',e);
  }
}

function renderBookings(bookings){
  const list=$('bookings-list');
  if(!bookings||bookings.length===0){
    list.innerHTML='<div class="empty-state"><div class="empty-icon">🍽️</div><div class="empty-text">No reservations yet today</div></div>';
    return;
  }
  
  list.innerHTML=bookings.slice(0,10).map(b=>{
    const initials=b.name.split(' ').map(n=>n[0]).join('').toUpperCase();
    const phone=b.caller_phone||'Unknown';
    return `
    <div class="bk-item">
      <div class="bk-avatar">${initials}</div>
      <div class="bk-info">
        <div class="bk-name">${b.name}</div>
        <div class="bk-meta">
          <div class="bk-meta-item">� ${phone}</div>
          <div class="bk-meta-item">� ${b.date||'TBD'}</div>
          <div class="bk-meta-item">� ${b.time||'TBD'}</div>
          <div class="bk-meta-item">� ${b.party_size||0} guests</div>
        </div>
      </div>
      <div class="bk-badge">Confirmed</div>
      <div class="bk-actions">
        <button class="action-btn" onclick="alert('Edit booking: '+${JSON.stringify(b.name)})">Edit</button>
        <button class="action-btn" onclick="window.location.href='tel:${phone}'">Call</button>
      </div>
    </div>
    `;
  }).join('');
}

function renderCalls(calls){
  const list=$('calls-list');
  if(!calls||calls.length===0){
    list.innerHTML='<div class="empty-state"><div class="empty-icon">📞</div><div class="empty-text">No call logs yet</div></div>';
    return;
  }
  
  list.innerHTML=calls.slice(0,15).map(c=>{
    const type=c.escalated?'escalated':'booking';
    const typeIcon=c.escalated?'⚠':'✓';
    const duration=c.duration_seconds?`${Math.floor(c.duration_seconds/60)}m ${c.duration_seconds%60}s`:'—';
    const timestamp=new Date(c.created_at).toLocaleString();
    const transcript=c.transcript?c.transcript.substring(0,100)+'...':'Call completed';
    return `
    <div class="call-item">
      <div class="call-top">
        <div class="call-icon ${type}">${typeIcon}</div>
        <div class="call-who">${c.session_id||'Unknown'}</div>
        <span class="call-tag ${type}">${type}</span>
      </div>
      <div class="call-text">"${transcript}"</div>
      <div class="call-meta">
        <span>Duration: ${duration}</span>
        <span>${timestamp}</span>
      </div>
    </div>
    `;
  }).join('');
}

function updateStats(bookings,calls){
  $('stat-bookings').textContent=bookings?bookings.length:0;
  $('stat-calls').textContent=calls?calls.length:0;
  
  const mods=calls?calls.filter(c=>c.call_type==='modification').length:0;
  $('stat-mods').textContent=mods;
  
  const resolved=calls?calls.filter(c=>!c.escalated).length:0;
  const rate=calls&&calls.length>0?Math.round(resolved/calls.length*100):0;
  $('stat-resolved').textContent=rate+'%';
}

// Load on page load
loadData();

// Refresh every 30 seconds
setInterval(loadData,30000);
</script>
</body>
</html>
